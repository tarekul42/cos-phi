<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equal Earth — a true-area world map</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0e1420;
    color: #e6edf3;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    width: min(96vw, 1180px);
    padding: 2.2rem 0 1.4rem;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-size: clamp(1.6rem, 3.4vw, 2.4rem);
    letter-spacing: 0.04em;
    font-weight: 650;
  }
  .sub {
    margin: 0.5rem 0 1.4rem;
    color: #9fb0c5;
    font-size: clamp(0.85rem, 1.6vw, 1rem);
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    background: #10233c;
    border-radius: 10px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
  }
  .country {
    fill: #8fbf9f;
    stroke: #10233c;
    stroke-width: 0.0035;
    stroke-linejoin: round;
    cursor: pointer;
    transition: fill 120ms ease;
  }
  .country:hover {
    fill: #ffd166;
  }
  .graticule {
    fill: none;
    stroke: rgba(255, 255, 255, 0.09);
    stroke-width: 0.0022;
    pointer-events: none;
  }
  .outline {
    fill: none;
    stroke: rgba(255, 255, 255, 0.5);
    stroke-width: 0.005;
    stroke-linejoin: round;
    pointer-events: none;
  }
  .foot {
    margin-top: 1.1rem;
    color: #6e8098;
    font-size: 0.8rem;
    line-height: 1.5;
  }
  .foot code {
    color: #9fb0c5;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
</style>
</head>
<body>
<main>
  <h1>EQUAL EARTH</h1>
  <p class="sub">Every country at its true relative area — projection derived from first principles, no libraries.</p>
  <svg id="map" role="img" aria-label="Equal Earth world map"></svg>
  <p class="foot">
    Equal-area pseudocylindrical projection · areas verified against spherical excess
    (<code>npm test</code>) · hover a country
  </p>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
